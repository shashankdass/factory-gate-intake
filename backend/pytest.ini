[pytest]
DJANGO_SETTINGS_MODULE = core.settings_test
python_files = test_*.py
testpaths = tests

# The suite runs on the project's documented SQLite escape hatch (set in
# conftest.py before Django loads) so it needs no Postgres, no Supabase and no
# API keys. The PII layer is exercised end to end either way — pgcrypto on
# Postgres, AES-256-GCM locally.
markers =
    postgres: requires a PostgreSQL connection (pgcrypto path)

filterwarnings =
    ignore::DeprecationWarning
