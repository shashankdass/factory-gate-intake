# Render Blueprint — deploys the whole monorepo (Django API + static React
# frontend + managed PostgreSQL) from a single push, all on Render's free tier.
#
# Import via Render dashboard → "New +" → "Blueprint" → pick this repo.
#
# Service names below determine the public URLs:
#   API      -> https://gate-intake-api.onrender.com
#   Frontend -> https://gate-intake-web.onrender.com
# If either name is already taken globally, Render appends a suffix — after the
# first deploy, confirm the real URLs and update CORS_ALLOWED_ORIGINS /
# VITE_API_BASE_URL below, then redeploy. (See DEPLOY.md.)
#
# Secrets marked `sync: false` are NOT stored in this file — Render prompts for
# them once at blueprint import. That covers the object-storage credentials and
# any resume-parser API key.

# Kept as a fallback while the Supabase cutover is verified. Nothing references
# it any more (DATABASE_URL is set manually), so it can be deleted once the app
# is confirmed running on Supabase — note Render's free databases expire after
# ~30 days regardless.
databases:
  - name: gate-intake-db
    plan: free
    databaseName: gate_intake
    user: gate_intake

services:
  # ---- Backend: Django REST API ----
  - type: web
    name: gate-intake-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    # Migrate + seed on every deploy so a fresh DB always has the dummy personas.
    # Both steps are idempotent. Migration 0007 installs pgcrypto + pg_trgm and
    # the app_encrypt/app_decrypt/app_blind_index helpers.
    startCommand: "python manage.py migrate --noinput && python manage.py seed_data && gunicorn core.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      # Set manually so the database can live outside Render. We use Supabase
      # Postgres — same project as the storage bucket, and its free tier pauses
      # after a week idle rather than being deleted after ~30 days like Render's.
      #
      # Use the **Session pooler** connection string:
      #   postgresql://postgres.<ref>:<password>@aws-<region>.pooler.supabase.com:5432/postgres
      #
      # Not the direct `db.<ref>.supabase.co` host — that is IPv6-only and
      # Render's egress is IPv4, which fails as an unexplained connection error.
      # Not the transaction pooler on :6543 either — it disables prepared
      # statements, which Django's persistent connections rely on.
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://gate-intake-web.onrender.com"
      - key: PYTHON_VERSION
        value: "3.12.6"

      # ---- Column-level PII encryption ----
      # Generated once by Render and then held constant. Rotating
      # PII_ENCRYPTION_KEY makes existing candidate name/phone/email
      # unrecoverable; rotating PII_BLIND_INDEX_KEY breaks name search and
      # duplicate detection for existing rows. They must differ from each other,
      # which two independent generateValue entries guarantee.
      - key: PII_ENCRYPTION_KEY
        generateValue: true
      - key: PII_BLIND_INDEX_KEY
        generateValue: true

      # ---- Object storage (S3-compatible, PRIVATE bucket) ----
      # Supabase Storage: https://<project-ref>.storage.supabase.co/storage/v1/s3
      # (the direct storage host — faster for large uploads than <ref>.supabase.co)
      # Create the bucket as private, then mint an S3 access key under
      # Project Settings → Storage → S3 access keys.
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET
        value: "gate-intake-docs"
      - key: S3_REGION
        # Must be the bucket's real region — Supabase rejects "auto" (that is an
        # R2-only value) and a mismatch fails as SignatureDoesNotMatch, which
        # misleadingly reads like a bad access key.
        value: "us-east-2"
      - key: S3_KEY_PREFIX
        value: "gate-intake"
      - key: PRESIGN_EXPIRY_SECONDS
        value: "900"

      # ---- Resume parsing ----
      # "ocr" needs no key and works out of the box. Switch to "claude" or
      # "gemini" for materially better extraction, and supply the matching key
      # (add `anthropic` / `google-genai` to requirements.txt first).
      - key: RESUME_PARSER_PROVIDER
        value: "ocr"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: "claude-opus-5"
      - key: GEMINI_API_KEY
        sync: false
      - key: REQUIRE_RESUME_FOR_COMPLIANCE
        value: "False"

      # ---- OCR for the intake workbench ----
      # Default free provider is OCR.space; "helloworld" is its public demo key —
      # replace with your own free key (no card) from https://ocr.space/ocrapi.
      - key: OCR_PROVIDER
        value: "ocrspace"
      - key: OCRSPACE_API_KEY
        value: "helloworld"

  # ---- Frontend: Vite static site ----
  # NOTE: no rootDir here. We build with an explicit `cd frontend` and publish an
  # explicit repo-root-relative path, which avoids Render's rootDir/publishPath
  # ambiguity that otherwise leaves index.html unpublished (404 / no-server).
  - type: web
    name: gate-intake-web
    runtime: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: frontend/dist
    envVars:
      # Baked into the bundle at build time — must be the API's public URL.
      - key: VITE_API_BASE_URL
        value: "https://gate-intake-api.onrender.com/api"
    routes:
      # SPA fallback so client-side routes (/contractor, /gate, …) resolve.
      - type: rewrite
        source: "/*"
        destination: "/index.html"
